name: Auto Update Bangla Playlist

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run playlist script
      run: python script.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Bangla ফোল্ডার এবং ভেতরের সব ফাইল ফোর্সেবলি স্টেজ করা
        git add -A Bangla/
        
        # কোনো পরিবর্তন থাকলে Commit ও Push করা
        if [ -n "$(git status --porcelain)" ]; then
          git commit -m "Auto-update IPTV playlist [skip ci]"
          git push
        else
          echo "No changes detected in Bangla folder."
        fi
