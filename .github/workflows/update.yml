name: Auto Merge IPTV

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download Sources
        run: |
          curl -L "https://iptvlive-beta.vercel.app" -o one.m3u

          curl -L "" -o two.m3u

          curl -L "" -o three.m3u
          
          curl -L "" -o four.m3u

      - name: Merge
        run: |
          cat one.m3u two.m3u three.m3u four.m3u > BDIX-Playlist.m3u

      - name: Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add BDIX-Playlist.m3u
          git commit -m "Auto merge playlists" || exit 0
          git push
